<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | ArchiVisual Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Create a client portal account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="auth-page">
    <div class="auth-card">
      <a class="navbar-brand auth-logo" href="index.html">
        <img src="favicon.svg" alt="ArchiVisual Studio Logo"
          style="width: 32px; height: 32px; display: inline-block; vertical-align: middle; margin-right: 8px;">
        <span style="display: inline-block; vertical-align: middle;">ArchiVisual Studio</span>
      </a>
      <h1>Create account</h1>
      <p>Join the client portal to track deliverables and approvals.</p>
      <form>
        <div class="mb-3">
          <label class="form-label" for="registerName">Full name</label>
          <input class="form-control" type="text" id="registerName" placeholder="Jane Cooper" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerEmail">Email address</label>
          <input class="form-control" type="email" id="registerEmail" placeholder="you@email.com" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerCompany">Company</label>
          <input class="form-control" type="text" id="registerCompany" placeholder="Horizon Developments" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerPassword">Password</label>
          <input class="form-control" type="password" id="registerPassword" placeholder="********" />
        </div>
        <div class="text-center">
          <button class="btn btn-primary" type="submit">Create account</button>
        </div>
      </form>
      <p class="mt-3">
        Already have access? <a href="login.html">Sign in</a>
      </p>
      <div class="mt-4 text-center">
        <button class="btn theme-toggle btn-sm" data-rtl-toggle aria-pressed="false">
          RTL Mode
        </button>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
