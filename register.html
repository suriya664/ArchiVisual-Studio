<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | ArchiStudio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Create a client portal account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="auth-page">
    <div class="auth-card">
      <a class="navbar-brand auth-logo" href="index.html">
        <img src="favicon.svg" alt="ArchiStudio Logo" class="logo-img">
        <span class="brand-text">ArchiStudio</span>
      </a>
      <h1 class="text-center auth-heading">Create account</h1>
      <p class="text-center">Join the client portal to track deliverables and approvals.</p>
      <form>
        <div class="mb-3">
          <label class="form-label" for="registerName">Full name</label>
          <input class="form-control" type="text" id="registerName" placeholder="Jane Cooper" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerEmail">Email address</label>
          <input class="form-control" type="email" id="registerEmail" placeholder="you@email.com" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerCompany">Company</label>
          <input class="form-control" type="text" id="registerCompany" placeholder="Horizon Developments" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerPassword">Password</label>
          <input class="form-control" type="password" id="registerPassword" placeholder="********" />
        </div>
        <div class="mb-3 text-start">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="agreeTerms">
            <label class="form-check-label" for="agreeTerms">I agree to the <a href="#"
                class="text-decoration-none">Terms and Conditions</a></label>
          </div>
        </div>
        <div class="text-center mb-3">
          <button class="btn btn-primary" type="submit">Create account</button>
        </div>
        <div class="text-center mb-3">
          <span class="text-muted">Or continue with</span>
        </div>
        <div class="d-flex justify-content-center gap-3 mb-4">
          <button class="btn btn-outline-secondary d-flex align-items-center gap-2" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Google
          </button>
          <button class="btn btn-outline-secondary d-flex align-items-center gap-2" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
            </svg>
            Facebook
          </button>
        </div>
      </form>
      <p class="mt-3 text-center">
        Already have access? <a href="login.html">Sign in</a>
      </p>
      <div class="mt-4 text-center">
        <button class="btn theme-toggle btn-sm" data-rtl-toggle aria-pressed="false" aria-label="Toggle RTL"></button>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
